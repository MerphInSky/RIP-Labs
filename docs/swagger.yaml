basePath: /
definitions:
  serializer.ComponentJSON:
    properties:
      component_id:
        type: integer
      description:
        type: string
      is_deleted:
        type: boolean
      photo_url:
        type: string
      thermal_resistance:
        type: number
      title:
        type: string
      video:
        type: string
    type: object
  serializer.HeatingComponentJSON:
    properties:
      component_id:
        type: integer
      heat:
        type: number
      heating_id:
        type: integer
      power_dissipation:
        type: number
    type: object
  serializer.HeatingJSON:
    properties:
      ambient_temperature:
        type: number
      completed_item_count:
        type: integer
      created_at:
        type: string
      creator_login:
        type: string
      description:
        type: string
      finish_date:
        type: string
      forming_date:
        type: string
      heating_id:
        type: integer
      moderator_login:
        type: string
      status:
        type: string
    type: object
  serializer.SignInRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  serializer.SignUpRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  serializer.SignUpResponse:
    properties:
      is_moderator:
        type: boolean
      login:
        type: string
    type: object
  serializer.StatusJSON:
    properties:
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для расчёта нагрева компонентов
  title: Heating API
  version: "1.0"
paths:
  /api/components:
    get:
      description: Возвращает все компоненты или фильтрует по названию
      parameters:
      - description: Название компонента для поиска
        in: query
        name: Title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список компонентов
          schema:
            items:
              $ref: '#/definitions/serializer.ComponentJSON'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить список компонентов
      tags:
      - components
    post:
      consumes:
      - application/json
      description: Создает новый компонент (с возможной загрузкой изображения/видео)
      parameters:
      - description: Данные нового компонента
        in: body
        name: component
        required: true
        schema:
          $ref: '#/definitions/serializer.ComponentJSON'
      produces:
      - application/json
      responses:
        "201":
          description: Созданный компонент
          schema:
            $ref: '#/definitions/serializer.ComponentJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Создать компонент
      tags:
      - components
  /api/components/{id}:
    get:
      description: Возвращает информацию о компоненте по идентификатору
      parameters:
      - description: ID компонента
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные компонента
          schema:
            $ref: '#/definitions/serializer.ComponentJSON'
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Компонент не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить компонент по ID
      tags:
      - components
  /api/heating_components/{component_id}/{heating_id}:
    delete:
      description: Удаляет связь компонента и заявки (только черновик)
      parameters:
      - description: ID компонента
        in: path
        name: component_id
        required: true
        type: integer
      - description: ID заявки
        in: path
        name: heating_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная заявка
          schema:
            $ref: '#/definitions/serializer.HeatingJSON'
        "400":
          description: Неверные ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить компонент из заявки
      tags:
      - heating_components
    put:
      consumes:
      - application/json
      description: Обновляет параметры компонента в конкретной заявке (только черновик)
      parameters:
      - description: ID компонента
        in: path
        name: component_id
        required: true
        type: integer
      - description: ID заявки
        in: path
        name: heating_id
        required: true
        type: integer
      - description: Новые данные
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/serializer.HeatingComponentJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленные данные
          schema:
            $ref: '#/definitions/serializer.HeatingComponentJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Не найдено
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить данные компонента в заявке
      tags:
      - heating_components
  /api/heating_components/add/{component_id}:
    post:
      description: Добавляет компонент в заявку-черновик пользователя
      parameters:
      - description: ID компонента
        in: path
        name: component_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявка с добавленным компонентом
          schema:
            $ref: '#/definitions/serializer.HeatingJSON'
        "201":
          description: Создана новая заявка
          schema:
            $ref: '#/definitions/serializer.HeatingJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Компонент не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Компонент уже в заявке
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Добавить компонент в заявку
      tags:
      - heating_components
  /api/heatings:
    get:
      description: Возвращает заявки с фильтрацией по датам и статусу. Создатель видит
        только свои, модератор — все.
      parameters:
      - description: Начальная дата (YYYY-MM-DD)
        in: query
        name: from-date
        type: string
      - description: Конечная дата (YYYY-MM-DD)
        in: query
        name: to-date
        type: string
      - description: Статус заявки
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список заявок
          schema:
            items:
              $ref: '#/definitions/serializer.HeatingJSON'
            type: array
        "400":
          description: Неверный формат даты
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Не авторизован
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить список заявок
      tags:
      - heatings
  /api/heatings/{id}:
    delete:
      description: Логическое удаление заявки (только черновик, только создатель)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявка удалена
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Удалить заявку
      tags:
      - heatings
    get:
      description: Возвращает полную информацию о заявке с компонентами
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Данные заявки с компонентами
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Неверный ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Получить заявку по ID
      tags:
      - heatings
    put:
      consumes:
      - application/json
      description: Обновляет данные заявки (только черновик)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные заявки
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/serializer.HeatingJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная заявка
          schema:
            $ref: '#/definitions/serializer.HeatingJSON'
        "400":
          description: Неверные данные
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Изменить заявку
      tags:
      - heatings
  /api/heatings/{id}/finish:
    put:
      consumes:
      - application/json
      description: Изменяет статус заявки на completed/rejected
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Новый статус (completed/rejected)
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/serializer.StatusJSON'
      produces:
      - application/json
      responses:
        "200":
          description: Результат модерации
          schema:
            $ref: '#/definitions/serializer.HeatingJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен (не модератор)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Завершить заявку (только модератор)
      tags:
      - heatings
  /api/heatings/{id}/form:
    put:
      description: Переводит заявку из черновика в статус "formed"
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Сформированная заявка
          schema:
            $ref: '#/definitions/serializer.HeatingJSON'
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Доступ запрещен
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Заявка не найдена
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Сформировать заявку
      tags:
      - heatings
  /api/heatings/cart:
    get:
      description: Возвращает информацию о текущей заявке-черновике пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Данные корзины
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить корзину заявки
      tags:
      - heatings
  /api/users/login:
    post:
      consumes:
      - application/json
      description: Принимает логин/пароль, возвращает JWT-токен
      parameters:
      - description: Логин и пароль
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/serializer.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Неверный логин или пароль
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход (получение токена)
      tags:
      - users
  /api/users/logout:
    post:
      description: Добавляет токен в blacklist Redis
      produces:
      - application/json
      responses:
        "204":
          description: Токен добавлен в blacklist
        "401":
          description: Токен не предоставлен
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Выход (инвалидация токена)
      tags:
      - users
  /api/users/register:
    post:
      consumes:
      - application/json
      description: Регистрирует нового пользователя
      parameters:
      - description: Логин и пароль
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/serializer.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/serializer.SignUpResponse'
        "400":
          description: Ошибка валидации
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Пользователь уже существует
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Регистрация пользователя
      tags:
      - users
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
